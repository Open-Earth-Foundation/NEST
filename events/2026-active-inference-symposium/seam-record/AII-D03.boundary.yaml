  packaged_version: {value: null, status: pending_owner, candidate: {value: "iiasa/message-ix-buildings branch sturm-weu-messageix-NEST @ e560643 (Shu Nawawi, 2026-10-08: 'Configure SSP2 WEU runners and R12 MESSAGE reporting' + 'Add SSP2 WEU reference outputs'); 10 commits ahead of main", status: observed, source: "Shu Nawawi #147 2026-10-09; branch read 2026-10-09"}, note: "a dedicated branch, not a release; pin by SHA. Bas (2026-10-09, via Francis Li): IIASA will share its WEU STURM as-is before the DC convening. OEF (2026-10-13, #147): residential and commercial SSP2 run from the public code at @6a9cb8b and at @e560643 and reproduce IIASA's shipped sturm/output row for row, for WEU and for all regions"}
  dataset:          {value: null, status: pending_owner, candidate: {value: "input_csv_SSP_2023_resid + input_csv_SSP_2023_comm, SSP2, with the climate-zone shares of 2026-01-29; price input sturm/data/input_prices_R12.csv", status: observed, source: "iiasa/message-ix-buildings@e560643 run_STURM_{resid,comm}_WEU_2026.R"}, note: "the shipped `_ex` example dataset is stale vs the code (lacks pop_urt); the full shipped dataset works (aii-run-2026-07-14)"}
  scope:            {value: "residential + non-residential buildings (commercial less detailed); NO appliances in EXP-01", status: declared, source: iiasa-2026-09-22, note: "was: residential only"}
  components:       {value: "CHILLED (Python; gridded degree-day demand) -> precomputed inputs to STURM, outside the price–demand loop; STURM (R; material-flow stock turnover + discrete-choice decisions) -> aggregation & reporting; GLANCE excluded; BENCH not part of the coupling (Alessio Mastrucci, 2026-10-12)", status: declared, source: "iiasa-2026-10-09 (Shu Nawawi, #147: 'CHILLED provides precomputed inputs to STURM and does not run inside the price–demand loop'); iiasa-2026-10-12 (Alessio Mastrucci, #147: 'BENCH is simply not part of the STURM-MESSAGE coupling'); iiasa-slide-2026-09-22"}
  geography_exp01:  {value: "STURM run for the 21 WEU building regions (custom_region_bld in the WEU runners), reported at region_bld and summed to R12_WEU; MESSAGEix side: the R12 region WEU (IIASA 2026-09-22). WEU is not the EU27; the aggregation set is declared on the seam (pairs.demand.translation.spatial.aggregation_set)", status: declared, source: "iiasa-2026-10-09 (Shu Nawawi, #147); iiasa-2026-09-22"}
