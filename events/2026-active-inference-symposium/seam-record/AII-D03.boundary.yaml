# Source: Open-Earth-Foundation/NEST-workspace (private) at commit d09776251bbb2746e5cf53ccb7eb59343bfd76e1, path docs/programme/partners/aii/deliverables/2026-08/AII-D03.boundary.yaml. Copied unchanged below this line. Links into the workspace do not resolve here.
# AII-D03 — boundary fields for the STURM wrapper blanket (DRAFT sidecar)
# Mirror of AII-D02: sensory/active reversed on the price/demand pair. Companion to
# AII-D03-sturm-wrapper.gnn.md (same folder).
#
# What lives here vs on the seam: this file holds STURM's NATIVE declaration of each variable.
# How a value is translated to or from MESSAGEix (temporal alignment, spatial exchange,
# allocation basis, mapping rule) lives once, on the seam, and is referenced with `see:`.
#
# What lives here vs in the GNN spec: the spec owns names, dims, types, roles and connections.
# This file owns units, conventions, supports, status and provenance. `role` is repeated here
# only so it can be checked against the spec's ActInfOntologyAnnotation; if they disagree, the spec wins.
#
# Status vocabulary: defined once, in AII-D02-D03-seam-messageix-sturm.yaml (with the optional
# fields added 2026-10-04).

blanket: AII-D03
model: >-
  STURM, as named at the 2026-09-22 meeting. CHILLED provides precomputed inputs to STURM and does not
  run inside the price–demand loop (Shu Nawawi, #147, 2026-10-09); GLANCE excluded (slide); BENCH is not
  part of the coupling (Alessio Mastrucci, #147, 2026-10-12). The wrapper spec names STURM only.
spec: AII-D03-sturm-wrapper.gnn.md
seam: AII-D02-D03-seam-messageix-sturm.yaml
schema_version: draft-0
prepared_by: AII (Holly Grimm)
prepared_on: 2026-09-22
updated: "2026-10-15 (p.read_by declared — Shu Nawawi 2026-10-14, #147: commercial technology and fuel choices are prescribed, a limitation of the current implementation, not a NEST choice; residential-only price response). 2026-10-13 review fix (Daniel Friedman): components says BENCH is not part of the coupling, matching its source. 2026-10-13 (p: read by the residential runner only — the commercial runner passes price_en = NULL; OEF reproduces the shipped SSP2 outputs row for row at both pins). 2026-10-12 (BENCH closed: not part of the coupling, Alessio; seam_scenario now resolves to the EXP1 cutout). 2026-10-09 (packaged version + dataset candidate = the sturm-weu-messageix-NEST branch; components: CHILLED declared outside the loop; regions and year set observed from the WEU runners; p: R11-keyed input, floor; d: commodity list, 13-year set, R12_WEU output). 2026-10-04 (units now live only here, not in the spec; run tied to the seam's scenario id, matching AII-D02). 2026-09-26 (blanket = native only; one status vocabulary; measured values tagged; drift fixed)"
sources:
  - docs/research/boundary-convention-benchmarks.md
  - "AII-D10 boundary ontology v0.1 — PR #146 (not merged)"
  - "IIASA, 2026-09-22 coupling meeting — recorded on #147"
  - "AII run 2026-07-14 on an AII workstation: shipped STURM run headless on its own data, then coupled to the public MESSAGEix Austria tutorial (not the reference run)"

