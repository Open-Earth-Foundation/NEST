variables:

  p:
    role: sensory                   # crosses INTO STURM, from MESSAGEix
    counterpart: AII-D02.p
    description: energy prices by fuel type
    read_by:           {value: "the residential runner only: the commercial runner passes price_en = NULL ('not used in commercial'), so commercial demand is price-insensitive in the shipped code and on the NEST branch — commercial technology and fuel choices are exogenously prescribed, demand is computed dynamically but does not read prices", status: declared, source: "iiasa-2026-10-14 (Shu Nawawi, #147 issuecomment-6162512245, answer 4: a limitation of the current commercial implementation, not something specific to NEST; 'expect price responsiveness from residential STURM only'); code: iiasa/message-ix-buildings@6a9cb8b sturm/model/F10_scenario_runs_MESSAGE_2100.R line 370; @e560643 lines 460 and 495; OEF doubling test (Francis Li, #147 issuecomment-6154237946, 2026-10-13)", note: "seam: pairs.prices.price_response (declared 2026-10-14)"}
    unit:
      value: "the PRICE_COMMODITY frame's unit — taken as is"
      status: observed
      source: aii-run-2026-07-14
      note: "STURM's price input accepted MESSAGEix's PRICE_COMMODITY dataframe without conversion; our earlier USD/GJ (from the catalog) was a guess"
    convention:        {value: {inherits: "AII-D02.p convention (annualisation, discounting)"}, status: pending_owner}
    temporal_support:  {value: {native: "one value per model year as given in the price file: 2020–2060 by 5, 2070–2110 by 10"}, status: observed, source: "iiasa/message-ix-buildings@e560643 sturm/data/input_prices_R12.csv; aii-run-2026-07-14 (5-year steps)"}
    spatial_support:   {value: {native: "the price input is keyed by R11 node (R11_WEU … 12 nodes), broadcast to the building regions inside STURM", regions: "region_bld (21 WEU regions in the WEU runners)"}, status: observed, source: "iiasa/message-ix-buildings@e560643 sturm/data/input_prices_R12.csv (node column); iiasa-2026-09-22"}
    translation:       {see: "AII-D02-D03-seam-messageix-sturm.yaml#pairs.prices"}   # downscaling, alignment, mapping rule, the floor transform
    validity_envelope:
      value: "price ratios outside the range STURM's turnover was calibrated on are untested; observed response is small (implied elasticity ≈ 0.13)"
      status: observed
      source: aii-run-2026-07-14

  ef:                               # NEW 2026-09-22 — emission factors from the IAM (IIASA slide). 2026-10-09: STURM's WEU reports carry no emissions and the public linkage passes prices only; kept pending the reference-run spec (seam: pairs.emission_factors.crossing_status)
    role: sensory                   # crosses INTO STURM, from MESSAGEix
    counterpart: AII-D02.ef
    description: emission factors per fuel, used to report buildings CO2
    unit:              {value: null, status: pending_owner, note: "t CO2 per energy unit — which?"}
    convention:        {value: null, status: pending_owner, note: "direct combustion only vs including electricity's upstream factor"}
    temporal_support:  {value: {native: "5-year steps"}, status: proposed}
    spatial_support:   {value: {native: "region_bld (all EU27 countries individually)"}, status: proposed}
    translation:       {see: "AII-D02-D03-seam-messageix-sturm.yaml#pairs.emission_factors"}
    validity_envelope: {value: null, status: n_a}

  d:
    role: active                    # crosses OUT to MESSAGEix
    counterpart: AII-D02.d
    description: "final energy demand by subsector × end use × carrier — buildings (residential + commercial), no appliances; 14 energy commodities per subsector, emitted by name (seam: pairs.demand.mapping_rule.fuel_to_commodity). The same report also carries floor-space (Mm2/y) and material (Mt/y) rows at level `demand`, outside the EXP-01 energy loop"
    unit:
      value: GWa
      status: observed
      source: aii-run-2026-07-14
      note: "output arrives in exactly the MESSAGE `demand` schema (node / commodity / level / year / time / value / unit); our earlier PJ/yr (from the catalog) was a guess"
    convention:        {value: "annual final energy per 5-year step; residential + non-residential buildings, no appliances (EXP-01 scope)", status: declared, source: iiasa-2026-09-22}
    temporal_support:  {value: {native: "one value per MESSAGE model year — 2020–2060 by 5, 2070–2100 by 10 (13 years) in the WEU runners; 5-year native"}, status: observed, source: "iiasa/message-ix-buildings@e560643 run_STURM_resid_WEU_2026.R; sturm/output/report_MESSAGE_resid_WEU_SSP2.csv; aii-run-2026-07-14"}
    spatial_support:   {value: {native: "region_bld (21 WEU regions in the WEU runners)", output_index: "R12 node column (R12_WEU); the MESSAGE report carries level `final`"}, status: declared, source: "iiasa-2026-10-09 (Shu Nawawi, #147); iiasa-2026-09-22"}
    translation:       {see: "AII-D02-D03-seam-messageix-sturm.yaml#pairs.demand"}   # alignment, sum into WEU, mapping rule (buildings share)
