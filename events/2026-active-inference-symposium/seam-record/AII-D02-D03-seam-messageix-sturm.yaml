open_questions_for_iiasa:              # the orange lines, as a list. Rewritten 2026-10-09 after Shu Nawawi's #147 answers; what he settled is now `declared` above (source iiasa-2026-10-09)
  - "the aligner in EXP1 (pairs.demand.translation.transform.exp1_use): optional (Shu Nawawi, 2026-10-14) or required given the base-year gap (Yiyi Ju, 2026-10-15; her afternoon answer specifies its target and conversion, so it presumes the aligner)? One line from either settles it. Its target SETTLED 2026-10-15 (Yiyi Ju): IEA × coverage_d02 (transform.target). data/ref_iea_bt.csv is on the public branch with Paul's consent (Yiyi Ju) — Bas van Ruijven to confirm it may be used in EXP1 (asked 2026-10-14) 2026-10-16: her two demand-entry options on #188 and OEF's share-above-one result (transform.exp1_use note; base_year_gap.second_number) make the native-level route unrunnable on this cutout as it stands; Francis Li has asked her whether she prefers aligned STURM values here"
  - "for Siddharth Joshi or Shu Nawawi: the useful-to-final converter — Yiyi Ju set 0.65 as the working value for the first pass on 2026-10-17 (0.78, her WEU 2015 figure, gives a buildings share of 1.12 on the cutout); confirm or correct it, and with it the executable form of the benchmark rule — final-energy basis, coverage and year together (transform.ue_fe_converter, base_year_gap.expression). Yiyi Ju reads the output GDX after 2026-10-20"
  - "benchmark year (SETTLED 2026-10-16 for the first pass): 2030 — a 2020 start is a full rebuild of the cutout, not a setting, possible from 2026-10-28 (Siddharth Joshi, #147 issuecomment-6207059197); OEF keeps 2030 (Francis Li, #147 issuecomment-6198921068). Alignment in the first pass is at fmy = 2030 (pairs.demand.translation.transform.first_model_year, declared); whether to rebuild for 2020 later is open"
  - "for Yiyi Ju: the prices reading — for EXP1 the cutout's baseline solve stands in for the static reference file, STURM's baseline pass runs on it and each mitigation pass overwrites it (pairs.prices.translation.transform.reference_series) — correct? (asked 2026-10-15)"
  - "reference price series (SETTLED 2026-10-14, Shu Nawawi): the default file is a static reference from a baseline without climate constraints; for EXP1 the cutout's own baseline solve is the reference (pairs.prices.translation.transform.reference_series). Which historical run made the shipped file no longer matters"
  - "runner set (SETTLED 2026-10-14, Shu Nawawi): the stand-alone WEU runners on sturm-weu-messageix-NEST give the EXP1 baseline; the ngfs_p6_bmt set (shu/fuel-switching-R_mitig_SN@ba59dc5: run_STURM_bmt_*, run_GLANCE_placeholder.R, run_MIXB_aligner.R) is the reference implementation of the loop, not integrated into EXP1 (reference.rung_B_placeholders.runner_set). Still for the spec: the one-node WEU adaptation of the price step — as coded it matches no reference rows on a plain WEU node and passes the reference prices unchanged (OEF, Francis Li, 2026-10-13)"
  - "commercial price response (SETTLED 2026-10-14, Shu Nawawi): commercial technology and fuel choices are exogenously prescribed; demand is computed dynamically but does not read prices — a limitation of the implementation, not a NEST choice; residential responds only (pairs.prices.price_response, declared)"
  - "for Siddharth Joshi: OEF's CPLEX solve of the cutout (GAMS 54.5.0, message_ix 3.11.1) matches the guide's price table except coal and fuel oil in 2030 and light oil in 2040 — seen at IIASA too, and which GAMS version made the guide's tables? (CPLEX options answered 2026-10-14 via Francis Li: message_ix defaults plus barcrossalg 2, same objective and prices — rung_B_placeholders.solver; the GAMS version and the three points still open)"
  - "run identity (SETTLED 2026-10-12: scenario.id = the NEST_EXP1 cutout). Two residual questions for Sidd: are the trade flows at the WEU boundary fixed from the global run (a closed cutout)? and is USD2005 the currency year of PRICE_COMMODITY here (the public reporting config labels it USD2010)?"
