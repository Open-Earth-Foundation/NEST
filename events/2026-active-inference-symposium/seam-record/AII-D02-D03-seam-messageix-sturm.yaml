# Source: Open-Earth-Foundation/NEST-workspace (private) at commit bb3d572785085d0048f0fa9a9aef0c6f8a47975e, path docs/programme/partners/aii/deliverables/2026-08/AII-D02-D03-seam-messageix-sturm.yaml. Copied unchanged below this line. Links into the workspace do not resolve here.
# Seam contract — MESSAGEix ↔ STURM (DRAFT)
# The pair-level record: one entry per exchanged quantity, holding the TRANSLATION between the
# sender's native declaration (active side) and the receiver's native declaration (sensory side).
# Neither model owns this file; the seam does. It is what the console's coupling record renders.
# Blanket-side native declarations live in AII-D02.boundary.yaml and AII-D03.boundary.yaml; everything
# about translating a value between the two (alignment, spatial exchange, allocation basis, mapping rule)
# lives only here, so it is written once.
#
# Status vocabulary (used by this file and both blanket files; six words, provenance goes in `source:`):
#   observed      — seen by AII in a run of the shipped model / public tutorial, or read in IIASA's public
#                   linkage code; not yet declared by the owner. source: says which run (e.g. aii-run-2026-07-14,
#                   AII workstation, not the reference run) or which repo@commit and file (code read 2026-10-06:
#                   iiasa/message-ix-models@9d5c68a, iiasa/message-ix-buildings@6a9cb8b). A code reading says
#                   what the public linkage does; whether the reference run uses it is the owner's to confirm.
#   guess         — AII's placeholder; expect the owner to replace it
#   proposed      — AII's default, pending the owner's confirmation
#   pending_owner — only the model owner (IIASA, for both models here) can supply it
#   declared      — fixed by a stated source: the wrapper spec, or the owner (source: iiasa-<date>)
#   n_a           — the field does not apply to this variable
# Status sits on each leaf: where a field has parts with different status (e.g. spatial.method vs
# spatial.aggregation_set), each part carries its own.
#
# Optional fields (added 2026-10-04; used by this file and both blanket files):
#   alternatives  — other defensible values for a structural choice. Independent of status: a choice can be
#                   `declared` for the reference run and still be varied later as a coupling uncertainty.
#   bounds        — numeric form of a validity_envelope {quantity, min, max}, so a run can be flagged as
#                   outside it. null = not yet known.
#   level         — the MESSAGE level (final / useful / …) a commodity value sits on.
#   uncertainty   — reserved on blanket variables for a variance or range (precision-weighted updates).
#   scenario_role — marks a blanket variable as a lever (a policy choice) when it is not an exchanged state.
#   transform     — (added 2026-10-09) a step applied to a value between sender and receiver that is not a unit,
#                   alignment or spatial operation (e.g. a floor, a rescale). Declared on the pair so a
#                   reproduction cannot omit it. `confirmed` is not a status: an owner-declared value is
#                   `declared` with source iiasa-<date>; a code reading is `observed` with repo@commit.

