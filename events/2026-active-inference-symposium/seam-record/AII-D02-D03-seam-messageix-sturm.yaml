exp01_scope:
  loop: "price <-> demand only; MESSAGEix-Materials (material demand, scrap release) exogenous — not coupled"          # IIASA, 2026-09-22
  buildings_side: "STURM (residential + commercial runners). CHILLED provides precomputed inputs to STURM and does not run inside the price–demand loop (Shu Nawawi, #147, 2026-10-09: declared). BENCH is not part of the STURM–MESSAGE coupling at all; the 2024 STURM–BENCH soft link was a one-off study (Alessio Mastrucci, #147, 2026-10-12: declared). GLANCE excluded (slide); the ngfs_p6_bmt runner set carries a GLANCE placeholder script"
  demand_scope: "residential + non-residential (commercial less detailed); no appliances"                                  # IIASA, 2026-09-22
  geography: "IIASA, 2026-09-22 (two statements): MESSAGEix exchanges at the R12 region WEU; STURM has all EU27 countries individually. Austria <-> Vienna judged difficult; urban level not in Stage 1"
  geography_note: >-
    R12_WEU is not the EU27 (iiasa/message-ix-models, data/node/R12.yaml): 16 EU members are in WEU
    (AUT BEL CYP DEU DNK ESP FIN FRA GRC IRL ITA LUX MLT NLD PRT SWE), 11 are in EEU
    (BGR CZE EST HRV HUN LTU LVA POL ROU SVK SVN), and WEU also holds non-EU countries
    (GBR NOR CHE TUR ISL + micro-states). The Stage-1 aggregation set is STURM's building regions whose
    R12 parent is WEU: 21 regions in STURM's region table (see pairs.demand.translation.spatial.aggregation_set).
    They cover R12_WEU apart from ten micro-states and territories (AND FRO GIB GRL IMN LIE MCO SJM SMR VAT).
