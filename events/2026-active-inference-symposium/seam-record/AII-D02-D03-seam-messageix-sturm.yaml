convergence:                          # the contract behind "iterates to a fixed point" — as coded in IIASA's public linkage (2026-10-06)
  source: "iiasa/message-ix-models@9d5c68a message_ix_models/model/buildings/__init__.py (build_and_solve, post_solve, _mpd); doc/buildings/index.rst"
  applies_to: [prices, demand]
  norm:           {value: "mean over node · commodity · year (2110 excluded) of |x_k - x_(k-1)| / (0.5 · (x_k + x_(k-1))) — a mean symmetric percentage deviation, computed separately on p and on d", status: observed}
  tolerance:      {value: 0.005, status: observed, note: "converged when the price deviation < 0.005, OR (from the second pass) the demand deviation < 0.005"}
  max_iterations: {value: null, status: observed, note: "a configuration value (Config.max_iterations; 1 = once-through). The documentation says that as of 2023-01-10 the iteration is not in active use and the models run once through; the NAVIGATE workflow ran a second pass by hand. 2026-10-07 (Siddharth Joshi, in the meeting): the current experiment is bi-directional MESSAGEix <-> STURM, 'run it only once' — consistent with once-through; a spoken description, not a declared config, so this stays observed. See reference.ladder. The wrappers' ModelTimeHorizon = 20 is an illustrative GNN horizon for the specs' t index, not this value (clarified 2026-10-13)."}
  damping:        {value: 1.0, status: observed, note: "full replacement each pass; no damping in the code. At the iteration limit without convergence, the last two demands are averaged and MESSAGE is solved once more."}
  initialisation: {value: "pass 0: prices from the base MESSAGE scenario (PRICE_COMMODITY at level final, cached) -> STURM -> demand written to the scenario -> MESSAGE solve", status: observed}
  on_failure:     {value: "as coded: average the last two demands, one more MESSAGE solve, log 'Not converged'. AII's addition: record the run as non-converged and keep it; never discard", status: proposed, note: "non-convergence and infeasibility are findings: futures where the two scales cannot agree"}
  run_record:                         # written once per coupled run
    - "converged (bool)"
    - "iterations (int)"
    - "residual per pair per iteration (the norm above)"
    - "infeasible (bool) — the MESSAGEix solve status"
    - "outside_envelope (bool per pair) — against the validity bounds"
  note: "the public code logs demand-track.csv and price-track.csv per iteration, which is most of run_record already. To confirm with IIASA: that the reference run uses this code, and its max_iterations."

