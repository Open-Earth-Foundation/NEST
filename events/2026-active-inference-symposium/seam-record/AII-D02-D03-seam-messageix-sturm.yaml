      - "M2 the resid_* / comm_* commodities built back into MESSAGE (rung_B_placeholders.demand_entry)"
      - "M3 one coupled baseline iteration; stretch: iterate until the change in cumulated final demand is below a threshold (convergence)"
      - "M4 mitigation runs under bound_emission (rung_B_placeholders.mitigation_case). Yiyi Ju's chicken-and-egg case — where MESSAGE-MACRO cannot solve under a low bound before any price reaches STURM, start from a prepared STURM demand set — presumes a MESSAGE-MACRO solve; the first pass is a MESSAGE solve (rung_B_placeholders.solve_type), so the prepared set is set aside and an infeasible mitigation solve is recorded as a finding (reworded 2026-10-16 after Yiyi Ju's #188 issuecomment-6210422010 and Francis Li's answer; spec §3 step 5 at 8023634)"
    note: "the milestones are IIASA's view of what a reproduction must pass through; EXP-01's own scoring (docs/programme/experiments/EXP-01-agentic-recoupling.md) sits on top of them"
  rung_B_placeholders:                # AII's pencilled values for rung B, 2026-10-08 (sent to Francis Li for his spec draft) — every leaf `guess` unless marked
    node:            {value: "WEU (the cutout's single node, no R11_/R12_ prefix) <-> STURM's 21-region aggregation set; STURM's price file is keyed R11_WEU, so a one-line node rename sits on the seam — and without it the price step as coded matches no reference rows and passes the reference prices unchanged (pairs.prices.translation.transform, note)", status: observed, source: "NEST_EXP1 xlsx node sheet (2026-10-12); sturm-weu-messageix-NEST@e560643 input_prices_R12.csv; iiasa/message-ix-models@13ce55d sturm.py read 2026-10-13 after Francis Li's #147 note"}
    year_set:        {value: "cutout: model years 2030–2060 by 5 and 2070–2110 by 10 (history 1990–2025 fixed); STURM's WEU runner emits 2020–2100 — so STURM's 2020 and 2025 are history on the MESSAGE side and 2110 is extrapolated in pre_solve", status: observed, source: "NEST_EXP1 xlsx year / cat_year sheets + guide ('from 2030 to 2110'); iiasa/message-ix-buildings@e560643 run_STURM_resid_WEU_2026.R; iiasa/message-ix-models@9d5c68a __init__.py (pre_solve)"}
    drivers:         {value: "SSP2 both sides; STURM input_csv_SSP_2023_{resid,comm} through the stand-alone WEU runners", status: declared, source: "iiasa-2026-10-14 (Shu Nawawi, #147 issuecomment-6162512245, answer 3: the WEU runners are stand-alone STURM runs configured for WEU under SSP2 and generate the baseline outputs for EXP1)", basis: "the shared baseline is SSP2; STURM data follows the SSP only"}
    runner_set:      {value: "the stand-alone WEU runners (sturm-weu-messageix-NEST@e560643) produce the EXP1 baseline; the BMT runner set is the reference implementation of the full loop (GLANCE, MIXB aligner), not integrated into EXP1", status: declared, source: "iiasa-2026-10-14 (Shu Nawawi, #147 issuecomment-6162512245, answer 3)"}
    carbon:          {value: "none: SSP2 baseline (no policy) in the cutout and in the Zenodo snapshot", status: observed, source: "NEST_EXP1 package name and guide; Zenodo record"}
    sequence:                         # the ORDER is declared; two details it refers to are not settled here (not_settled_here)
      value: "baseline: STURM on the reference prices -> resid_* / comm_* demand into MESSAGE -> one solve = the coupled baseline. Mitigation: bound_emission on MESSAGE -> solved prices (transformed) to STURM -> demand back -> solve again (iteration i1). One iteration per scenario is daily practice; iterating until the cumulated final demand changes by less than a threshold is the stretch (milestones M3)"
      status: declared
      source: "iiasa-2026-10-15 (Yiyi Ju, #147 issuecomments 6191047214 and 6191808711: 'please do use this order in EXP1'); was AII's pencilled order of 2026-10-08 (guess, from Sidd 2026-10-07 'run it only once'), restated by Holly Grimm on #147 2026-10-14 and confirmed"
      basis: "Sidd 2026-10-07: 'run it only once, price response of demand'"
      not_settled_here: {value: "which prices 'the reference prices' are for EXP1 — Shu Nawawi's answer is recorded at pairs.prices.translation.transform.reference_series, AII's reading of Yiyi Ju's remark awaits her confirm-or-correct; and whether an aligner step runs after each STURM pass on the benchmark year — Yiyi Ju's order has it, pairs.demand.translation.transform.exp1_use is pending. The declared order does not settle either", status: pending_owner, source: "Daniel Friedman, #184 review 5534358195 (2026-10-15), finding 1"}
    convergence:     {value: "iteration cap 1, no damping; the published 0.5 % rule recorded as unused", status: observed, source: "doc/buildings/index.rst (once-through since 2023-01)"}
    demand_entry:
      value: "the buildings build step applied to the cutout, creating the resid_* / comm_* commodities STURM emits and the AFOFI remainder by share (rc_afofi.py) — what the public linkage does. The cutout as shipped has only rc_therm / rc_spec / non-comm (xlsx commodity + demand sheets, 2026-10-12); the built cutout is a different state from the cutout before construction"
      status: declared
      source: "iiasa-2026-10-15 (Yiyi Ju, #147 issuecomment-6191808711, milestone M2: 'successfully build the comm_* and resid_* back to MESSAGE')"
      basis: "the spec writes the step down"
      fallback:
        value: "B0, the first-pass rule of the EXP-01 rung-B spec (#188): rc_therm_new = rc_therm_base × (1 + s × (R_1 / R_ref − 1)) by year, where R is STURM's residential heat and hot-water final energy summed over fuels and s is the residential share of rc_therm (placeholder: STURM's own residential share of buildings heat at WEU, which overstates s by leaving out AFOFI); rc_spec, non-comm and commercial demand stay at the baseline. Only STURM's relative response crosses, never its level"
        status: proposed
        source: "OEF (Francis Li), #188 spec §5.3 at 8023634 (2026-10-16); recorded on the seam by AII (Holly Grimm, #188 review 5553629974, finding 1). Replaces the level-share route AII had pencilled on 2026-10-15, which the spec does not use"
        costs: "the base-year gap cannot show in the solve, so the aligner's correction mostly drops out under B0; STURM's fuel switching is reported beside each pass and not fed back; the coupled baseline equals the uncoupled one only if R_1 and R_ref are computed the same way — shown as a controlled check, not assumed"
        acceptance: "R_ref finite and nonzero in every year; R_1 and R_ref matched on region, subsector, year, unit and alignment processing; s with a documented range and source (above 0 and up to the placeholder); baseline equality as a controlled check (Daniel Friedman, #188 issuecomment-6200134158, point 3; spec §5.3 and §6)"
        note: "a labelled fallback, not a second declared route (Daniel Friedman, #184 review 5534358195, finding 2). Tests aggregate residential feedback; does not stand in for the declared buildings / fuel-switching route"
      share_formula: {value: "the buildings share of rc_therm + rc_spec that the build step needs, from a historical year: (comm_*_2020 + resid_*_2020) × ue_fe_converter_2020 / (rc_spec_2020 + rc_therm_2020); the non-buildings (AFOFI) share is the remainder", status: proposed, source: "iiasa-2026-10-16 (Yiyi Ju, #188 issuecomment-6210207613)", note: "rc_afofi.py has not been used in IIASA's daily work for about three years, because the non-buildings share differs a lot across regions without IEA alignment in STURM (Yiyi Ju). Her two options for EXP1: 'native STURM output level + rc_afofi' (her suggestion for a one-region model) or 'aligned STURM value + elastic non-STURM placeholder'. OEF tried the formula on 2026-10-16 (Francis Li, #188 issuecomment-6223156796): at STURM's native 2020 level with the proposed 0.78 the STURM-covered share comes out above one (pairs.demand.translation.transform.base_year_gap.second_number), and the build step at 13ce55d reads the share from IIASA's internal database and expects prefixed region nodes — so B0 stays for the first pass and demand entry on the one-node cutout is back with IIASA (Francis Li to Yiyi Ju: aligned STURM values, a share input, or a WEU node mapping in the build step?). 2026-10-17 (Yiyi Ju, #188 issuecomment-6233101039): her arithmetic on OEF's numbers, (220 + 380) × 0.78 / (([withheld] + [withheld] GWa)) = 1.12; to proceed, ue_fe_converter_2020 = 0.65, which gives 0.94; computing the share at OEF 'sounds good'. The build-step code blocker (internal database, prefixed nodes) is still OEF's to work around", acceptance: {value: "if the formula gives a STURM-covered share at or above one — STURM's level above MESSAGE's — the run stops and the user investigates; an error or warning in EXP1, not a silent clip", status: declared, source: "iiasa-2026-10-17 (Yiyi Ju, #188 issuecomment-6233101039, 'function-wise')"}}
    solver:          {value: "GAMS 45+ with CPLEX for the prices, MESSAGEix 3.11 / ixmp 3.11.1, local HSQLDB via read_excel; ~16 GB RAM; the demo licence is too small. OEF solved the cutout under its 30-day evaluation licence on 2026-10-13 and matched the guide; HiGHS reproduces the objective but not CPLEX's fuel prices (a degenerate LP: the duals are not unique), so prices are taken from CPLEX as a declared choice. Measured 2026-10-13 (OEF, GAMS 54.5.0 / message_ix 3.11.1): final energy by fuel matches the guide with both solvers; CPLEX matches the guide's price table except three points (coal and fuel oil in 2030, light oil in 2040 — for Sidd to confirm); HiGHS differs from CPLEX at 23 price points (pairs.prices.validity_envelope.solver_dependence). IIASA's recommended CPLEX options (Siddharth Joshi, 2026-10-14, via Francis Li) are message_ix's own defaults plus barcrossalg 2, and give the same objective and prices on the cutout (spec §5.5 at 8023634)", status: declared, source: "iiasa-2026-10-12 (quickstart guide + notebook); iiasa-2026-10-14 (Siddharth Joshi, CPLEX options, via Francis Li); OEF (Francis Li), 2026-10-13, #147 issuecomment-6154237946", basis: "NEST has no licence (OEF compute-environment design: delegation to IIASA; a 30-day GAMS evaluation licence covering CPLEX and HiGHS was granted to OEF's AWS setup, 2026-10-09)"}
    solve_type:      {value: "MESSAGE, not MESSAGE-MACRO: the cutout's notebook solves with model='MESSAGE', OEF's three solves ran MESSAGE_run.gms, and the cutout as shipped carries no MACRO calibration (no historical_gdp, gdp_calibrate, aeei or price_MESSAGE), so MESSAGE-MACRO cannot run on it yet. Consequences: the only price–demand feedback in rung B is STURM's residential response; an infeasible mitigation solve is final and is recorded as a finding; the prepared STURM demand set (milestones M4) has no role in the first pass. IIASA's NGFS loop (message-ix-models@13ce55d project/ngfs/workflow.py) takes prices from a MESSAGE solve and re-solves with MESSAGE-MACRO once STURM's demand is back — a later step for rung B if wanted, for which OEF asks IIASA for a MACRO-calibrated cutout or the add_macro inputs", status: declared, source: "iiasa-2026-10-16 (Yiyi Ju, #188 issuecomment-6210422010: the D02 cutout is 'very likely a MESSAGE solve'); OEF (Francis Li, #188 issuecomment-6222500962; spec §5.1 at 8023634); iiasa-2026-10-17 (Yiyi Ju, #188 issuecomment-6232855912)", note: "Yiyi Ju 2026-10-17: MESSAGE-MACRO covers the price–demand feedback of the NON-STURM parts of useful energy; in EXP1 it would exclude rc_therm and rc_spec because the building sector's feedback happens in STURM (the public code also drops transport, for message-ix-transport). Without MACRO, infeasibility is not expected because the bound comes from a full-demand run; but EXP1's deliverables must state that price–demand feedback exists only in the STURM-covered part. A MACRO-calibrated cutout needs extra parameters from Siddharth Joshi; who coordinates that is open. Spec §5.1 to be updated accordingly (her ask)"}
    mitigation_case: {value: "clone the MESSAGE starting scenario, set tax_emission = 800 for emission type TCE in all nodes, solve, retrieve the EMISS level of TCE in all nodes and years, and add those levels as bound_emission to the coupled baseline. OEF ran it on 2026-10-16 with the tax on node WEU only (World is WEU's parent and carries the same emissions, so a tax on both would count each tonne twice); the tax run and the baseline under the resulting bound both solve to optimal with MESSAGE, so the bound is feasible on the uncoupled baseline", status: declared, source: "iiasa-2026-10-16 (Yiyi Ju, #188 issuecomment-6210274699); OEF (Francis Li, #188 issuecomment-6223156796; spec §3 step 5 at 8023634); iiasa-2026-10-17 (Yiyi Ju, #188 issuecomment-6233101039)", note: "the answer to 'which bound do IIASA's coupled mitigation runs use' is this recipe, not a number. WEU-only tax accepted by Yiyi Ju on 2026-10-17 ('Sounds good'), also marked answered in #188 §7 at 3ebd5be; the tax's currency unit is to be read from the cutout and written beside it (Holly Grimm, #188 Section 4 suggestion)"}
    d11_tolerance:   {value: "mean absolute % deviation < 5 % on returned demand, < 10 % on prices, per commodity · year", status: guess, basis: "between August's 20 % and near-exact"}

pairs:

  prices:
    quantity: energy prices
    sender:   {blanket: AII-D02, variable: p, role: active,  native: "PRICE_COMMODITY duals per node · commodity · level · year · time"}
    receiver: {blanket: AII-D03, variable: p, role: sensory, native: "prices by fuel type per building region per 5-year step"}
    direction: messageix -> sturm
    authority: {value: sender, status: declared, note: "the optimiser's dual is the price; STURM responds, does not set it"}
    price_response:                 # NEW 2026-10-13 — which STURM subsector actually reads p
      value: "residential only: the commercial runner calls the stock model with price_en = NULL ('not used in commercial'), so commercial demand does not respond to MESSAGE's prices in the public code or on the NEST branch; the price -> demand feedback of the loop is residential"
      status: declared
      source: "iiasa-2026-10-14 (Shu Nawawi, #147 issuecomment-6162512245, answer 4: commercial technology and fuel choices are exogenously prescribed, not chosen by the cost-based logit the residential model uses; commercial demand is still computed dynamically but does not respond to prices — a limitation of the current commercial implementation, not something specific to NEST; 'expect price responsiveness from residential STURM only'); code: iiasa/message-ix-buildings@6a9cb8b sturm/model/F10_scenario_runs_MESSAGE_2100.R line 370 and @e560643 lines 460 and 495 (price_en = NULL; source comment 'not used in commercial'); OEF (Francis Li), #147 issuecomment-6154237946, 2026-10-13: doubling every price left the commercial output byte-identical while residential moved. Lines re-read by AII 2026-10-13"
      note: "so for rung B the loop is two-way for the resid_* commodities and one-way (STURM -> MESSAGE) for comm_*: commercial demand enters MESSAGE and nothing comes back to it. The July implied elasticity (0.13) was measured on the residential tutorial run. Declared by Shu Nawawi on 2026-10-14 as a limitation of the implementation, not a NEST choice; no priced commercial case exists. An agent scoring rung B should expect a zero commercial response, not a small one."
    translation:
      unit:
        value: identity at the boundary; divided by u_EJ_GWa = 31.71 inside STURM
        status: observed
        source: "aii-run-2026-07-14 (table taken as is); iiasa/message-ix-buildings@6a9cb8b sturm/model/F10_scenario_runs_MESSAGE_2100.R lines 47 and 103 (the division)"
        note: "PRICE_COMMODITY is USD_2010/kWa (see AII-D02.p). Dividing by 31.71 (GWa per EJ) gives ≈ USD_2010/GJ; the exact factor is 31.536 GJ/kWa (365-day year), so STURM's internal prices sit 0.55 % low — small, but it would show in a reproduction. The same 31.71 is exact for the EJ/yr -> GWa demand conversion (pairs.demand.translation.unit), so the error is on prices only. Cross-check 2026-10-09: STURM's shipped price input (iiasa/message-ix-buildings@e560643 sturm/data/input_prices_R12.csv) has R11_WEU 2020 values electr 389, gas 123, lightoil 115, d_heat 159, biomass 60, coal 58 — ÷ 31.71 gives 12.3 / 3.9 / 3.6 / 5.0 / 1.9 / 1.8 USD/GJ, consistent with USD/kWa. Which MESSAGE run produced that file is open."
      transform:                      # NEW 2026-10-09 — the step Siddharth Joshi described on 2026-10-07 ('marginal prices come back as negative, there needs to be some calibration')
        value: "solved PRICE_COMMODITY (level final, six commodities) is merged onto a STURM reference price file; nodes are mapped R12 -> R11 (R12_CHN -> R11_CHN, R12_RCPA -> R11_CPA, else prefix swap); where solved / reference < 1 the REFERENCE value is kept for every commodity except electr (a floor at the reference); electr may fall below. Without a solution the reference file is passed unchanged."
        status: observed
        source: "iiasa/message-ix-models@13ce55d (branch project/ngfs_p6_bmt) message_ix_models/model/buildings/sturm.py (_write_sturm_prices, call_sturm) — pointer: Shu Nawawi, #147, 2026-10-09"
        note: "so for the five non-electricity fuels (biomass, coal, lightoil, gas, d_heat) negative or collapsed marginals never reach STURM; electr is exempt from the floor and passes through as solved, low or negative included. The calibration Sidd mentioned on 2026-10-07 is the demand-side aligner (pairs.demand.translation.transform), not a step in this function. The reference file sturm/data/input_prices_R12_default.csv (on shu/fuel-switching-R_mitig_SN@ba59dc5) is byte-identical to input_prices_R12.csv on sturm-weu-messageix-NEST@e560643 (same MD5, 2026-10-13): one reference price series, R11-keyed, 2020–2110; which MESSAGE run produced it is still open. Whether the reference run applies this step is the owner's to confirm. ONE-NODE CASE (read 2026-10-13, after Francis Li's #147 note): map_r12_to_r11 returns any node that is not R12_* unchanged, so the cutout's plain WEU stays WEU; the left merge onto the R11_WEU-keyed reference file then matches no rows, lvl_new is empty, the written file equals the reference and the function returns 0 rows updated — with no warning on that path. Unadapted, rung B's STURM would read the reference prices, not the cutout's. The adaptation (node rename before the merge, or a WEU-keyed reference file) belongs to the rung-B spec (Francis Li + Holly Grimm). Reproduced independently by Daniel Friedman (#147 issuecomment-6156491307, 2026-10-13) by executing the public function on synthetic rows: plain WEU with solved 600/600 -> 0 matched rows, reference 100/200 written back; R12_WEU -> 2 matched, 600/600 written; R12_WEU with gas 50 / electr -10 -> gas floored to 100, electr written as -10 (the electricity exception is real). Yiyi Ju 2026-10-17 (#188 issuecomment-6233259427): the same floor sits in model/buildings/build.py on project/ngfs_p6_bmt (around L262, the merge-and-floor helper), put in as a compromise because the round-zero price alignment did not strictly happen; she has never observed a negative electricity price in practice, at most negative fossil-fuel prices in the near term — so the electricity exception is a code property, and the negative values in the controls above are synthetic rows, not EXP1 output (she asked which; she will read the GDX after 2026-10-20)."
        acceptance:                   # NEW 2026-10-13 — what the one-node adaptation must satisfy before a price exchange counts (Daniel Friedman's controls, #147 issuecomment-6156491307)
          value: "an explicit, versioned node mapping; zero matched price rows with a solved frame supplied is a FAILURE, never a silent reference fallback; expected key coverage and unmatched keys recorded; three receipts per exchange — raw solved prices, post-map matches, post-floor values — with the non-electricity floor and the electricity exception checked by controls like the synthetic rows above; solver identity and version bound to the price receipt, duals compared as well as objective and final energy"
          status: proposed
          source: "AII, from Daniel Friedman's #147 comment 2026-10-13 (items 1, 2, 5); to be carried into the rung-B spec's one-node adaptation (Holly Grimm)"
        reference_series:             # NEW 2026-10-14 — which prices the floor and STURM's baseline refer to
          value: "the committed default file (input_prices_R12_default.csv) is a static reference, typically the commodity prices of a baseline scenario without climate constraints; each MESSAGE run overwrites input_prices_R12.csv with its own prices and the default stays as the series price changes are measured against. For EXP1 the cutout's own baseline solve (scenario.id, CPLEX duals) supplies the reference series"
          status: declared
          source: "iiasa-2026-10-14 (Shu Nawawi, #147 issuecomment-6162512245, answer 2)"
          note: "so which historical MESSAGE run made the shipped file no longer matters for EXP1. Yiyi Ju (2026-10-15, meso lens) adds that feeding MESSAGE's solved prices to STURM as its default input 'does not happen strictly in reality'; AII reads the two as one statement for EXP1 — the baseline solve stands in for the static file, STURM's baseline pass runs on it, each mitigation pass overwrites it — and has asked her to correct that reading if wrong (#147 issuecomment-6193304149)"
        alternatives: ["floor at the STURM reference (as coded)", "clip negatives to a small positive floor", "pass the dual unchanged"]
      convention:
        value: {carried: "the run's annualisation + discounting, unchanged", downscaling: "national price -> STURM region: how, in the hand coupling?"}
        status: pending_owner
      temporal_alignment:
        value: "run's model years -> STURM 5-year steps, held piecewise-constant"
        status: proposed
        note: "July run: Austria decades held over STURM's 5-year steps"
        alternatives: ["held piecewise-constant", "linear interpolation"]
      spatial:
        method:
          value: "one WEU node -> STURM's building regions whose R12 parent is WEU: broadcast (one price for all)"
          status: declared
          source: iiasa-2026-09-22
        aggregation_set:
          value: "the 21 STURM building regions mapped to WEU — same set as pairs.demand"
          status: declared
          source: "iiasa-2026-10-09 (Shu Nawawi, #147: the WEU runners on sturm-weu-messageix-NEST; regions_R61.csv is the map). Read 2026-10-06 from iiasa/message-ix-buildings@6a9cb8b regions_R61.csv (R11 and R12 columns)"
        node_index:
          value: "STURM's price input is keyed by R11 nodes (R11_WEU …), 12 nodes, even in the R12 coupling: the linkage maps R12 -> R11 before writing it (see transform)"
          status: observed
          source: "iiasa/message-ix-buildings@e560643 sturm/data/input_prices_R12.csv (node column); iiasa/message-ix-models@13ce55d sturm.py (map_r12_to_r11)"
          note: "so on the R11 baseline STURM reads prices as they stand; WEU is the same set in both"
        note: "was: node -> region_bld via the D05 crosswalk at H3 res 5; the res-5/res-8 Vienna pair is a Stage-4 matter"
      allocation_basis: {value: null, status: n_a, note: "Stage 1: a broadcast needs no spatial weights; D05 weights apply to Stage-4 downscaling"}
      mapping_rule:
        fuel_to_commodity:
          value: "six MESSAGEix commodities cross: biomass, coal, lightoil, gas, electr, d_heat (the _GLB node excluded); STURM's fuel map from those is inside STURM"
          status: observed
          source: "iiasa/message-ix-models@9d5c68a message_ix_models/model/buildings/build.py (get_prices)"
        level:
          value: final
          status: observed
          source: "iiasa/message-ix-models@9d5c68a message_ix_models/model/buildings/build.py (get_prices: filters level=final)"
          note: "so the price STURM sees is the fuel price at final, not a useful-energy dual — the question raised on 2026-10-04 is answered for the public code; the reference run is to confirm"
    validity_envelope:
      value: "STURM's response is small (implied elasticity ≈ 0.13); large price swings outside its calibration are untested"
      status: observed
      source: aii-run-2026-07-14
      observed_response: {implied_elasticity: 0.13, note: "magnitude, as measured in the July run (residential; the commercial runner does not read prices — see price_response)"}
      solver_dependence: {value: "on the EXP1 cutout: CPLEX matches the guide's price table except three points (coal and fuel oil in 2030, light oil in 2040); HiGHS reaches the same objective and the same final energy by fuel but differs from CPLEX at 23 price points. On the public global baseline (Zenodo 10514052, run with the 3.10 equations): HiGHS = CPLEX on the objective and on the six STURM fuels in R11_WEU in every year; 324 of 1 601 final prices differ by more than 1 % across all regions, nearly all hydrogen, ethanol and methanol. Why the cutout differs where the public model does not is open", status: observed, source: "OEF (Francis Li), #147 issuecomment-6154237946, 2026-10-13 (GAMS 54.5.0, message_ix 3.11.1)", note: "the first measurement of how much p depends on the solver rather than the model; rung B takes the CPLEX duals (reference.rung_B_placeholders.solver)"}
      bounds:
        quantity: "price relative to STURM's calibration baseline, per fuel"
        min: {value: "1.0 for every fuel except electr (the code floors at the reference price — see translation.transform); none for electr", status: observed, source: "iiasa/message-ix-models@13ce55d sturm.py (_write_sturm_prices)"}
        max: null
        status: pending_owner
        note: "STURM's calibrated price range. The lower bound is enforced in code; the upper bound is still the owner's. A native property of STURM: move to AII-D03.p once that file carries it."

  demand:
    quantity: final energy demand
    sender:   {blanket: AII-D03, variable: d, role: active,  native: "buildings final energy (residential + non-residential) by fuel per region_bld per 5-year step, emitted in the MESSAGE `demand` schema"}
    receiver: {blanket: AII-D02, variable: d, role: sensory, native: "`demand` parameter: node · commodity · level · year · time · value · unit"}
    direction: sturm -> messageix
    authority: {value: sender, status: proposed, note: "STURM's stock turnover sets buildings demand; MESSAGEix's dynamic constraints bound how much of the delta is feasible (observed corridor ≲ +5 %)"}
    translation:
      unit:
        value: identity at the boundary (GWa); STURM converts its EJ totals with u_EJ_GWa = 31.71 before emitting
        status: observed
        source: "iiasa-2026-10-09 (Shu Nawawi, #147: GWa); iiasa/message-ix-buildings@e560643 sturm/output/report_MESSAGE_{resid,comm}_WEU_SSP2.csv (unit column = GWa); aii-run-2026-07-14 (GWa both sides); @6a9cb8b sturm/model/R01_report_MESSAGE.R lines 14 and 55–56 (EJ × 31.71)"
        note: "the same constant serves two different conversions and only one of them is off: for energy, 1 EJ/yr = 31.7098 GWa on a 365-day year, so 31.71 is exact to 0.0007 % and the demand conversion carries no material error; for prices, USD/kWa -> USD/GJ needs 31.536 GJ/kWa, so dividing by 31.71 puts STURM's internal prices 0.55 % low (pairs.prices.translation.unit). They do not cancel: demand is unaffected, prices are 0.55 % low. Year convention implied by 31.71: 365 days (31.536e6 s); a 365.25-day year would give 31.688 and 31.5576. Corrected 2026-10-13 after Daniel Friedman's review (the earlier note claimed the same offset on both and a cancellation). WEU SSP2 totals in Shu's reports: residential 380.7 GWa in 2020 (≈ 12.0 EJ) falling to 124.2 by 2100; commercial 220.7 (≈ 7.0 EJ) to 141.9"
      transform:                      # NEW 2026-10-13 — the demand-side calibration Siddharth Joshi mentioned on 2026-10-07
        value: "the MIXB aligner: for gas, coal, oil and electricity, STURM's 2020 final energy per R12 region is compared with the IEA 2020 balance (data/ref_iea_bt.csv); where the global gap exceeds 0.1 EJ, each region's series is scaled to IEA at 2020 (method 'scale', allocation 'regional') and the correction fades exponentially (λ = 5) to zero at 2080; years after 2080 keep raw STURM. Output: sturm/message_linking/{resid,comm}_sturm_aligned_{code}.csv, which call_buildings_demand reads"
        status: observed
        source: "iiasa/message-ix-buildings@ba59dc5 (branch shu/fuel-switching-R_mitig_SN) sturm/run_MIXB_aligner.R (STEP 0 parameters: ALIGN_FUELS, ALIGN_THRESH_EJ 0.1, ALIGN_APPLY_START 2020, ALIGN_APPLY_END 2080, ALIGN_FADE exponential, ALIGN_METHOD scale, ALIGN_GAP_ALLOCATION regional, IEA_ALIGN_YEAR 2020); message_linking/resid_sturm_R_mitig_SN.csv vs resid_sturm_aligned_R_mitig_SN.csv — pointer: Francis Li, 2026-10-13"
        note: "measured on the branch's own CSVs: R12_WEU resid_heat_gas 125.3 GWa raw -> 110.4 aligned in 2020 (× 0.88), × 0.95 in 2030, × 1.00 from 2080. Whether the aligner runs in the EXP1 coupling or only in the NGFS / CircEUlar workflows is the owner's to say; an agent reproducing rung B needs it declared either way. The IEA reference file: from a paid IEA dataset, Bas van Ruijven to confirm it may be used (Shu Nawawi, 2026-10-14); already on the public branch with Paul's consent (Yiyi Ju, 2026-10-14) — see iea_reference."
        alternatives: ["IEA-2020 scaling with exponential fade (as coded)", "no alignment (raw STURM)", "additive correction (the aligner's other method)"]
        exp1_use:                     # NEW 2026-10-15 — does the EXP1 coupling run the aligner?
          value: null
          status: pending_owner
          note: "two IIASA statements: Shu Nawawi (2026-10-14, #147 issuecomment-6162512245): the aligner was built for the NGFS / CircEUlar workflow; for EXP1 start with the SSP2 baseline and the price–demand loop, proceed without it and keep it optional, also pending the data-sharing question. Yiyi Ju (2026-10-15, issuecomment-6191047214): with STURM 9 % above the cutout's RC level the aligner comes first, to force STURM to an aligned benchmark-year level; without it the first coupled solve risks infeasibility (her 2026-10-14 comment). AII records Yiyi's as the current position and asked either of them to settle it in one line (issuecomment-6193304149). Her afternoon answer (issuecomment-6195036530) names the aligner's target and conversion, so it presumes the aligner runs; Shu Nawawi has not replied since. 2026-10-16: Yiyi Ju's two demand-entry options on #188 (issuecomment-6210207613) are 'native STURM output level + rc_afofi' (her suggestion; no aligner) or 'aligned STURM value + elastic non-STURM placeholder' (with it); OEF's share-above-one result (base_year_gap.second_number) shows the native-level route cannot run on this cutout as it stands — evidence for her earlier reading that the aligner comes first, or for a corrected converter. The spec at 8023634 §5.2 runs the aligner from the first pass; Francis Li has asked Yiyi Ju which she prefers on the one-node cutout. Still pending_owner"
        target:
          value: "the benchmark-year level the STURM aligner forces: IEA × coverage_d02 — 'in the EXP1 only STURM-covered usage types are linked, so (number-wise) I put IEA × coverage_d02 there' (Yiyi Ju). A placeholder for the usage types MESSAGE covers and STURM does not, with constant elasticities in later mitigation runs, is cut out until EXP1 works"
          status: declared
          source: "iiasa-2026-10-15 (Yiyi Ju, #147 issuecomment-6195036530, answering AII's 'should it read coverage_d03?' of issuecomment-6193304149; first stated in her micro lens, issuecomment-6191047214)"
        ue_fe_converter:              # NEW 2026-10-15 afternoon — the IEA line is final energy, the cutout's rc_therm / rc_spec are useful-level; WORKING VALUE set 2026-10-17
          value: "rc_spec + rc_therm = (IEA × coverage_d03 + appliance + cooking + …) × ue_fe_converter; a dimensionless constant works for EXP1 (region / energy / year dimensions would be more decent). For EXP1's first pass: 0.65 (Yiyi Ju's working value of 2026-10-17, 'so that you can proceed'); her earlier 0.78 was WEU 2015 on her working data and gives a buildings share of 1.12 on the cutout (demand_entry.share_formula)"
          status: declared
          source: "iiasa-2026-10-17 (Yiyi Ju, #188 issuecomment-6233101039); earlier iiasa-2026-10-15 (#147 issuecomment-6195036530: 'Sid/Shu should have the expertise to correct me'), after Daniel Friedman's useful-vs-final point (#184 review 5534358195, finding 3; #147 issuecomment-6193914894)"
          note: "a working value to let the first pass run, not a measurement: Siddharth Joshi or Shu Nawawi to confirm or correct; the executable reporting / conversion expression stays pending until the final-energy basis, coverage and year are named together (base_year_gap.expression)"
        iea_reference:
          value: "ref_iea_bt.csv: 'Final Energy|Residential and Commercial' covers every residential and commercial end use — space heating, space cooling, water heating, cooking, appliances, lighting, and AFOFI — so its scope is wider than STURM's (no appliances or cooking) by construction; benchmark year bmy = 2020 (IEA has 2023 by now)"
          status: declared
          source: "iiasa-2026-10-15 (Yiyi Ju, #147 issuecomment-6191047214)"
          shareable: {value: "on the public branch already, with Paul's consent (Yiyi Ju, 2026-10-14); from a paid IEA dataset, so Bas van Ruijven to confirm it may be used in EXP1 (Shu Nawawi, 2026-10-14; asked on #147 2026-10-14)", status: pending_owner}
        base_year_gap:                # NEW 2026-10-14 — the check Yiyi Ju asked for: if D02 and D03 differ by more than a threshold in the base year, an aligner is needed
          definitions: "fmy = MESSAGE's first model year (2030 in the cutout); bmy = the IEA benchmark year (2020); coverage_d02 = MESSAGE's RC scope as a share of the IEA scope in bmy (per region, EJ/EJ); coverage_d03 = STURM's scope as a share of the IEA scope in bmy; pass_threshold = 0.05 (Yiyi Ju, 2026-10-15; loosen in tests if needed). Alignment is checked at fmy and is only meaningful when fmy = bmy, since it reflects history, not model output"
          first_number: {value: "PRELIMINARY — unmatched in scope and year. 2030: STURM's WEU SSP2 residential + commercial final energy 533 GWa (16.8 EJ; resid 318 + comm 215) against the cutout's RC reported as final energy [withheld] GWa ([withheld] EJ, ACT × input over the rc technologies, Sidd's notebook): STURM +9.3 %. The two sides do not cover the same end uses (the cutout's RC includes AFOFI; STURM excludes appliances and cooking), 2030 is not the benchmark year, and the cutout identifies rc_therm / rc_spec at level useful — so neither the direction of the scope-corrected gap nor a pass or fail against pass_threshold is established. 2020: STURM 601 GWa (19.0 EJ) against the cutout's history, not yet compared", status: observed, source: "AII 2026-10-14 (#147 issuecomment-6172743768) from iiasa/message-ix-buildings@e560643 sturm/output/report_MESSAGE_{resid,comm}_WEU_SSP2.csv and the NEST_EXP1 notebook's RC reporting", note: "qualified 2026-10-15 after Daniel Friedman's #184 review 5534358195, findings 3 and 4 (was: 'over the 5 % line', 'undercounts the true gap')"}
          second_number: {value: "the same gap seen from the demand-entry side: with STURM's native 2020 level for WEU and the proposed converter 0.78, Yiyi Ju's buildings-share formula (reference.rung_B_placeholders.demand_entry.share_formula) gives a STURM-covered share of rc_therm + rc_spec above one, so the AFOFI remainder would be negative — STURM's buildings total, converted to useful, exceeds the whole of the cutout's rc demand, AFOFI included. Same direction as first_number (STURM above MESSAGE in the base year); not a pass or fail, since expression is pending and the converter is a working value. Yiyi Ju's arithmetic (2026-10-17): 1.12 at 0.78, 0.94 at 0.65", status: observed, source: "OEF (Francis Li), #188 issuecomment-6223156796 and spec §5.3 at 8023634 (2026-10-16); read by AII in the #188 review 5553629974; Yiyi Ju, #188 issuecomment-6233101039"}
          coverage_breakdown: {value: null, status: proposed, note: "AII produces the breakdown of how much of the IEA R&C benchmark each side covers in bmy, on the iea_reference definition (owed since 2026-10-14)"}
          rule: {value: "if Σ(rc_therm + rc_spec) in D02 at bmy does not match IEA × coverage_d02 within pass_threshold, stop and investigate D02 (for EXP1 take coverage_d02 as it is, below 1); if Σ(resid_* + comm_*) in D03 at bmy does not match IEA × coverage_d03, stop and investigate D03 — in EXP1 STURM is much larger, so the aligner runs first", status: declared, source: "iiasa-2026-10-15 (Yiyi Ju, micro lens)", note: "Yiyi Ju's wording, attributed; its executable form is `expression` below"}
          expression: {value: null, status: pending_owner, note: "the executable form of the rule. The cutout's rc_therm / rc_spec are useful-level demand, the IEA line is final energy, and the notebook reports final energy as ACT × input over the rc technologies — equal GWa labels do not settle the mapping. The owner names the final-energy reporting / conversion expression, coverage and year together (Daniel Friedman, #147 issuecomment-6193914894); Yiyi Ju's ue_fe_converter is the first element, Siddharth Joshi / Shu Nawawi to confirm"}
        first_model_year:             # NEW 2026-10-15 — where the alignment can happen; SETTLED 2026-10-16 for the first pass
          value: "2030 for the first pass — OEF's provisional run choice (Francis Li, #147 issuecomment-6198921068; spec §5.2 at 8023634). Moving the cutout's first model year to 2020 is a full rebuild, not a setting: Siddharth Joshi recommends a rebuild over hacking the model back from 2025/2030 and can do it from 2026-10-28 (#147 issuecomment-6207059197). So alignment in the first pass happens at fmy = 2030, and a 2020 rebuild is a later choice"
          status: declared
          options: ["shift the cutout's first model year to 2020 (= bmy) and run the aligner on bmy at the end of the residential and commercial runners in every iteration — a change to the cutout (Siddharth Joshi to say whether a rebuild or a setting)", "keep 2030 and align fmy there — works technically, less scientific sense (Yiyi Ju)"]
          source: "iiasa-2026-10-15 (Yiyi Ju, micro lens, the two solutions); put to Siddharth Joshi and Francis Li on #147 issuecomment-6193304149 — AII writes the aligner step either way"
          decision_rule: {value: "2020 if no additional work is needed from Siddharth Joshi — simply setting firstmodelyear in the cat_year set of the cutout from 2030 to 2020; if not, 2030 for now", status: declared, source: "iiasa-2026-10-15 (Yiyi Ju, #147 issuecomment-6195036530)", note: "applied 2026-10-16: Sidd's answer is a rebuild, so 2030"}
          note: "touches AII-D02.run_identity / temporal support: the selected run has model years from 2030 with 2020 and 2025 as history (rung_B_placeholders.year_set). A run decision, not a benchmark result (Daniel Friedman, #184 review 5538523044): the first pass gives a plumbing result at 2030, and base_year_gap.expression stays pending"
      convention:
        value: "annual energy per period; the sender covers buildings only (residential + non-residential, no appliances) — see mapping_rule.buildings_share"
        status: declared
        source: iiasa-2026-09-22
      temporal_alignment:
        value: "STURM emits one value per MESSAGE model year directly — 2020–2060 by 5, 2070–2100 by 10 (13 years) — so no alignment step is needed up to 2100; 2110 is extrapolated by the linkage (pre_solve, from the 2090->2100 growth ratio)"
        status: observed
        source: "iiasa/message-ix-buildings@e560643 run_STURM_resid_WEU_2026.R (years_to_run = seq(2020, 2060, 5), seq(2070, 2100, 10)); sturm/output/report_MESSAGE_resid_WEU_SSP2.csv (year column); iiasa/message-ix-models@9d5c68a __init__.py (pre_solve)"
        note: "was: 'STURM 5-year values -> run's model years, held piecewise (or interpolated?)'. The runner takes the year list as an argument, so the alignment is by construction"
        alternatives: ["STURM run on the model years (as coded)", "held piecewise-constant", "linear interpolation"]
      spatial:
        method:
          value: "STURM's building regions whose R12 parent is WEU -> one WEU node: plain sum (energy is extensive)"
          status: declared
          source: iiasa-2026-09-22
        aggregation_set:
          value: "21 STURM building regions: C-WEU-{AUT, BEL, CHE, CYP, DEU, DNK, ESP, FIN, FRA, GBR, GRC, IRL, ISL, ITA, LUX, MLT, NLD, NOR, PRT, SWE} + Türkiye — identical in the table's R11 and R12 columns; outputs reported at both region_bld and R12_WEU"
          status: declared
          source: "iiasa-2026-10-09 (Shu Nawawi, #147: 'dedicated STURM branch with residential and commercial runners set up for WEU under SSP2 … outputs at both individual country and R12_WEU levels'; regions_R61.csv); iiasa/message-ix-buildings@e560643 run_STURM_resid_WEU_2026.R (custom_region_bld). Read 2026-10-06 from @6a9cb8b regions_R61.csv (pointer: Francis Li)"
          note: "covers R12_WEU (31 codes, iiasa/message-ix-models@9d5c68a data/node/R12.yaml) except ten micro-states and territories: AND FRO GIB GRL IMN LIE MCO SJM SMR VAT — negligible for buildings demand. The EU27 alternative is not what the runner does."
          alternatives: ["STURM's building regions whose R12 parent is WEU (as coded)", "all EU27 (spans WEU and EEU)"]
        note: "was: region_bld -> node via the D05 crosswalk with population / floor-area / dwelling-count weights; that becomes relevant only for downscaling at Stage 4"
      allocation_basis: {value: null, status: n_a, note: "Stage 1: a sum needs no spatial weights"}
      mapping_rule:                        # the identity decisions — lives HERE, once, not on either blanket
        fuel_to_commodity:
          value: "one MESSAGEix commodity per subsector × end use × carrier, 14 per subsector: {resid,comm}_{heat,hotwater}_{biomass,coal,d_heat,electr,gas,lightoil}, {resid,comm}_cool_electr, {resid,comm}_other_uses_electr — STURM emits them by name, so the fuel choice is made in STURM. (The July tutorial run collapsed them: Σ resid_*_electr -> other_electricity.)"
          status: declared
          source: "iiasa-2026-10-09 (Shu Nawawi, #147: 'specified separately by residential/commercial subsector, end use, and energy carrier — for example comm_hotwater_gas, in GWa. The fuel choice is therefore made by STURM'); iiasa/message-ix-buildings@e560643 sturm/output/report_MESSAGE_{resid,comm}_WEU_SSP2.csv (commodity column; also floor-space Mm2/y and material Mt/y rows at level `demand`, outside the EXP-01 energy loop)"
        level:
          value: "useful in MESSAGEix (STURM's own report carries level `final`)"
          status: declared
          source: "iiasa-2026-10-09 (Shu Nawawi, #147: two approaches exist — useful-energy translation, or final-energy override of the rc dynamics; 'for the implementation linked, PRICE_COMMODITY is explicitly retrieved at the final level, while the aligned building demands are added to MESSAGEix at the useful level'); iiasa/message-ix-models@9d5c68a __init__.py (pre_solve: `.assign(level=\"useful\")`); @e560643 report_MESSAGE_resid_WEU_SSP2.csv (level = final); aii-run-2026-07-14"
          note: "the quantity is FINAL energy, entered at level `useful` on purpose — the code comment reads 'Set energy demand level to useful (although it is final) to be in line with 1 to 1 technologies btw final and useful'. No conversion efficiency sits between the levels. Prices are read at final (pairs.prices.mapping_rule.level), so the two sides are consistent. Declared for the linked implementation; which of the two approaches the reference run takes is the spec's to say."
          alternatives: ["useful-energy approach: STURM demand entered at useful behind 1:1 technologies (as coded)", "final-energy approach: STURM final energy overrides the rc demand dynamics"]
        buildings_share:                  # was residential_share — reframed 2026-09-22; DISSOLVED 2026-10-09
          value: "no share rule needed: buildings demand lands on its own one-to-one commodities (fuel_to_commodity), which nothing outside buildings uses — transport and industry are service demands (passenger-distance, tonnes of steel) whose carriers MESSAGEix chooses. What remains of the composite rc sector (agriculture, forestry, fisheries — AFOFI) stays in MESSAGE as a share of rc_therm / rc_spec"
          status: declared
          source: "iiasa-2026-10-09 (Shu Nawawi, #147, answer 1); iiasa/message-ix-models@13ce55d (and @9d5c68a) model/buildings/rc_afofi.py (AFOFI share of rc_therm / rc_spec, from the private MESSAGE_Buildings code via the ECE IEA database)"
          note: "was: 'ratio-to-baseline on the buildings component; industry/transport remainder held fixed' (proposed). The question 'separate commodities or one?' is answered: separate. Open for an R11 run: the resid_* / comm_* commodities exist only after the buildings build step (see reference.rung_B_placeholders.demand_entry)"
          alternatives: ["separate one-to-one commodities (as coded; AFOFI remainder by share)", "ratio-to-baseline on a shared rc commodity (the July tutorial)"]
        year_alignment:
          see: "AII-D02-D03-seam-messageix-sturm.yaml#pairs.demand.translation.temporal_alignment"
          note: "was 'held piecewise' (proposed); superseded 2026-10-09 by the observed rule in temporal_alignment — STURM runs on the model years directly through 2100 and the linkage extrapolates 2110 — which is the authoritative field (Daniel Friedman's review, 2026-10-13)"
        regions_to_node:
          value: "plain sum of the 21 building regions mapped to WEU (see spatial.aggregation_set; no weights)"
          status: proposed
          note: "sum/broadcast with no weights is IIASA's framing (2026-09-22); the set is observed from STURM's region table (2026-10-06)"
    validity_envelope:
      value: "feasible demand delta bounded by MESSAGEix's growth caps (≲ +5 % observed); anchor year outside the coupling boundary"
      status: observed
      source: aii-run-2026-07-14
      bounds: {see: "AII-D02.boundary.yaml#variables.d.validity_envelope.bounds"}   # native to MESSAGEix, so the numbers live on its blanket

